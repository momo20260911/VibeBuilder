# Vibe Builder 反向代理配置（Rocky Linux / RHEL / CentOS 系列）
# 端口结构：应用跑在 127.0.0.1:3000；Nginx 对外监听 80 / 443；
#   80  → 跳转 HTTPS；443 → 反代到 3000。
# 本文件是「HTTP 起步版」（只有 80 块）。443 块由 `certbot --nginx` 自动生成，
# 无需手动添加，详见 DEPLOY.md 第十步。
# 用法：
#   1) 把下面的 server_name 改成你的域名（或服务器 IP）
#   2) sudo cp nginx.conf /etc/nginx/conf.d/vibe-builder.conf
#   3) （可选）sudo mv /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default.conf.bak
#   4) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name vibe.example.com;   # ← 改成你的域名（或服务器 IP）

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE 流式关键：必须关闭缓冲，否则生成过程会卡住/一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
